name: Build ZH Aim IPA

on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build binary
        run: |
          mkdir -p App Payload/ZHAim.app
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios13.0 \
            -parse-as-library \
            -framework UIKit -framework SwiftUI -framework Foundation \
            -framework AVFoundation \
            -o App/ZHAim App/AppDelegate.swift
      - name: Dong goi
        run: |
          cp App/ZHAim Payload/ZHAim.app/
          cp Info.plist Payload/ZHAim.app/
          chmod +x Payload/ZHAim.app/ZHAim
      - name: Nen IPA
        run: zip -r ZHAim.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ZHAim-IPA
          path: ZHAim.ipa
