
name: Build ZH Swift IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
ỏ    runs-on: macos-latest
    ( steps:
      - uses: actions/checkout@giv4
      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Tao Xcode project
        run: |
          mkdir -p ZH.xcodeproj
          echo "Xcode project se build binary bang swiftc truc tiep"
      - name: Build Swift binary
        run: |
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios13.0 \
            -framework UIKit -framework SwiftUI -framework Foundation \
            -o App/ZHInject App/AppDelegate.swift
      - name: Ky entitlements
        run: |
          codesign --force --sign - \
            --entitlements entitlements.plist \
            App/ZHInject
      - name: Tao Payload
        run: |
          mkdir -p Payload/ZHInject.app
          cp App/ZHInject Payload/ZHInject.app/
          cp Info.plist Payload/ZHInject.app/
          chmod +x Payload/ZHInject.app/ZHInject
      - name: Nen IPA
        run: zip -r ZHInject.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ZHInject-IPA
          version: 8.0.0
          path: ZHInject.ipa
