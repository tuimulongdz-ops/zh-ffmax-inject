
name: Build ZH Swift IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Tao cau truc thu muc
        run: |
          mkdir -p App
          mkdir -p Payload/ZHInject.app

      - name: Build Swift binary
        run: |
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios13.0 \
            -framework UIKit -framework SwiftUI -framework Foundation \
            -o App/ZHInject App/AppDelegate.swift

      - name: Ky entitlements
        run: |
          codesign --force --sign - \
            --entitlements entitlements.plist \
            App/ZHInject

      - name: Dong goi Payload
        run: |
          cp App/ZHInject Payload/ZHInject.app/
          cp Info.plist Payload/ZHInject.app/
          cp entitlements.plist Payload/ZHInject.app/
          chmod +x Payload/ZHInject.app/ZHInject

      - name: Nen IPA
        run: zip -r ZHInject.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZHInject-IPA
          path: ZHInject.ipa
