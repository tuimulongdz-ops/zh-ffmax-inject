
name: Build ZH FF MAX Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build binary
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o App/ZHInject App/AppDelegate.m
      - name: Ky entitlements
        run: |
          codesign --force --sign - \
            --entitlements entitlements.plist \
            App/ZHInject
      - name: Tao Payload
        run: |
          mkdir -p Payload/ZHInject.app
          cp App/ZHInject Payload/ZHInject.app/
          cp Info.plist Payload/ZHInject.app/
          chmod +x Payload/ZHInject.app/ZHInject
      - name: Nen IPA
        run: zip -r ZHInject.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ZHInject-IPA
          path: ZHInject.ipa
