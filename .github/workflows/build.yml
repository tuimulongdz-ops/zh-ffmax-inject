
name: Build FF MAX Inject IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Tao Payload
        run: |
          mkdir -p Payload
          cp -r App Payload/ZHInject.app
          cp Info.plist Payload/ZHInject.app/
      - name: Nen IPA
        run: zip -r ZHInject.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: ZHInject-IPA
          path: ZHInject.ipa
